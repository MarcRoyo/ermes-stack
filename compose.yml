services:
  orchestrator:
    image: ermes-orchestrator:latest
    pull_policy: never

    build:
      context: ../ermes-orchestrator
      dockerfile: Dockerfile

    restart: unless-stopped

    environment:
      AGENT_CARD_URL: ${AGENT_CARD_URL}
      GRPC_ENDPOINT: ${GRPC_ENDPOINT:-}

    ports:
      - "8090:8090"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8090/health'
          )
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  tts:
    build:
      context: ../ermes-tts/services/tts
      dockerfile: Dockerfile
    volumes:
      - ${ERMES_DATA_ROOT}/tts/data:/home/user/app/data
    ports:
      - "7860:7860"
      - "8000:8000"
  music-agent:
    build:
      context: ../ermes-agents/agents/music-agent
      dockerfile: Dockerfile
    environment:
      - PULSE_SERVER=unix:/tmp/pulse/native
      - SDL_AUDIODRIVER=dummy #pulseaudio
      - XDG_RUNTIME_DIR=/tmp/.xdg_runtime_dir
    volumes:
      - ${ERMES_DATA_ROOT}/music-agent/data:/home/user/app/data
      - /mnt/wslg/:/mnt/wslg/
      - /mnt/wslg/PulseServer:/tmp/pulse/native:ro
    ports:
      - "9999:9999"
    # PulseAudio access via WSLg socket is provided through /mnt/wslg mount
  config-agent:
    build:
      context: ../ermes-agents/agents/config-agent
      dockerfile: Dockerfile
    volumes:
      - ${ERMES_DATA_ROOT}/config-agent/data:/home/user/app/data
      - ${ERMES_DATA_ROOT}/config-agent/training:/home/user/app/training_data
    ports:
      - "9998:9998"
    depends_on:
      standalone:
        condition: service_healthy
  mcp-server:
    build:
      context: ../ermes-mcp
      dockerfile: Dockerfile
    volumes:
      - ${ERMES_DATA_ROOT}/mcp/mcp-delta-data:/home/user/app/delta_data
    ports:
      - "8182:8182"
    depends_on:
      standalone:
        condition: service_healthy

  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"
      - "9000:9000"
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.6.24
    command: ["milvus", "run", "standalone"]
    security_opt:
    - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - ${DOCKER_VOLUME_DIRECTORY:-.}/volumes/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy

      minio:
        condition: service_healthy
        
  llama-server:
    image: ermes-llamacpp:cuda12.9-sm61
    pull_policy: never
    
    build:
      context: ../ermes-llamacpp
      dockerfile: Dockerfile
      args:
        CUDA_VERSION: "12.9.1"
        UBUNTU_VERSION: "24.04"
        CUDA_ARCH: "61"
        LLAMA_CPP_REF: "master"
        BUILD_JOBS: "1"



    restart: unless-stopped

    ports:
      - "8081:8081"

    volumes:
      - ${ERMES_DATA_ROOT}/models:/models:ro

    command:
      - -m
      - /models/${LLAMA_MODEL_FILE}
      - --mmproj
      - /models/${LLAMA_MMPROJ_FILE}
      - --n-gpu-layers
      - ${LLAMA_GPU_LAYERS}
      - --jinja
      - --embeddings
      - --pooling
      - cls
      - --host
      - "0.0.0.0"
      - --port
      - "8081"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:8081/health
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

networks:
  default:
    name: ermes

