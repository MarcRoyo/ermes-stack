# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  init:data:
    desc: Initialize Ermes data directories
    cmds:
      - poetry run python -m tools.compose init

  prepare:mcp:
    desc: Prepare MCP server
    dir: ../ermes-mcp
    cmds:
      - task prepare

  up:
    desc: Start Ermes services
    cmds:
      - poetry run python -m tools.compose up -d

  down:
    desc: Stop Ermes services
    cmds:
      - poetry run python -m tools.compose down

  build:
    desc: Build Ermes services
    deps:
      - prepare:mcp
    cmds:
      - poetry run python -m tools.compose build

  follow:
    desc: Follow Ermes logs
    cmds:
      - poetry run python -m tools.compose logs -f {{.CLI_ARGS}}

  logs:
    desc: Show Ermes logs. It can be limited to a specific service by passing the service name as an argument. 
    cmds:
      - poetry run python -m tools.compose logs {{.CLI_ARGS}}

  ps:
    desc: Show Ermes services
    cmds:
      - poetry run python -m tools.compose ps
 
  status:
    desc: Show Ermes services status
    cmds:
      - poetry run python -m tools.compose status

  compose:config:
    desc: Show resolved Docker Compose configuration
    cmds:
      - poetry run python -m tools.compose config