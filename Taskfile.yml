# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  init:data:
    desc: Initialize Ermes data directories
    cmds:
      - poetry run python -m tools.compose init

  prepare:mcp:
    desc: Prepare MCP server
    dir: ../ermes-mcp
    cmds:
      - task prepare

  prepare:orchestrator:
    desc: Prepare orchestrator
    dir: ../ermes-orchestrator
    cmds:
      - task prepare

  up:
    desc: Start Ermes services
    cmds:
      - poetry run python -m tools.compose up -d --force-recreate

  up:audioserver:
    desc: Start/recreate Windows AudioServer
    aliases:
      - run:audioserver
    cmds:
      - poetry run python -m tools.windows_task audioserver restart

  "up:*":
    desc: Start/recreate a single Ermes service
    vars:
      SERVICE: '{{index .MATCH 0}}'
    cmds:
      - poetry run python -m tools.compose up -d --force-recreate --no-deps {{.SERVICE}}

  down:
    desc: Stop Ermes services
    cmds:
      - poetry run python -m tools.compose down
  
  stop:audioserver:
    desc: Stop Windows AudioServer
    aliases:
      - audio:stop
    cmds:
      - poetry run python -m tools.windows_task audioserver stop

  build:
    desc: Build all Ermes services
    cmds:
      - task: build:audioserver
      - task: prepare:mcp
      - poetry run python -m tools.compose build

  build:audioserver:
    desc: Build Windows AudioServer
    cmds:
      - poetry run python -m tools.windows_task audioserver build

  build:orchestrator:
    desc: Build orchestrator
    cmds:
      - task: prepare:orchestrator
      - poetry run python -m tools.compose build orchestrator
  
  "build:*":
    desc: Build a single Ermes service
    vars:
      SERVICE: '{{index .MATCH 0}}'
    cmds:
      - poetry run python -m tools.compose build {{.SERVICE}}

  logs:
    desc: Show Ermes logs
    cmds:
      - poetry run python -m tools.logs logs

  "logs:*": # we put * in quotes to avoid wrong behaviour of the YAML parser
    desc: Show logs for one service
    vars:
      SERVICE: '{{index .MATCH 0}}'
    cmds:
      - poetry run python -m tools.logs logs {{.SERVICE}}

  follow:
    desc: Follow Ermes logs
    cmds:
      - poetry run python -m tools.logs follow

  "follow:*":
    desc: Follow logs for one service
    vars:
      SERVICE: '{{index .MATCH 0}}'
    cmds:
      - poetry run python -m tools.logs follow {{.SERVICE}}

  logs:mcp:
    desc: Show logs for mcp-server
    cmds:
      - poetry run python -m tools.logs logs mcp-server

  follow:mcp:
    desc: Follow logs for mcp-server
    cmds:
      - poetry run python -m tools.logs follow mcp-server

  ps:
    desc: Show Ermes services
    cmds:
      - poetry run python -m tools.compose ps
 
  status:
    desc: Show complete Ermes services status
    cmds:
      - poetry run python -m tools.status

  compose:config:
    desc: Show resolved Docker Compose configuration
    cmds:
      - poetry run python -m tools.compose config

  audio:
    desc: Run an AudioServer Windows task
    cmds:
      - poetry run python -m tools.windows_task audioserver {{.CLI_ARGS}}

  run:
    desc: Start complete Ermes environment
    cmds:
      - task: run:audioserver
      - task: up

  stop:
    desc: Stop complete Ermes environment
    cmds:
      - defer:
          task: audio:stop
      - task: down

  restart:
    desc: Restart complete Ermes environment
    cmds:
      - task: stop
      - task: run

  restart:audioserver:
    desc: Restart Windows AudioServer
    cmds:
      - task: stop:audioserver
      - task: up:audioserver

  clean:docker:
    desc: Clean unused Docker build cache
    cmds:
      - docker builder prune -f
      
  clean:docker:all:
    desc: Remove all unused Docker build cache
    cmds:
      - docker builder prune -a -f