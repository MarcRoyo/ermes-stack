# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  DATA_ROOT:
    sh: 'printf "%s" "${ERMES_DATA_ROOT:-$HOME/.local/share/ermes}"'

tasks:
  init:data:
    cmds:
      - mkdir -p "{{.DATA_ROOT}}/music-agent"
      - mkdir -p "{{.DATA_ROOT}}/config-agent/data"
      - mkdir -p "{{.DATA_ROOT}}/config-agent/training"
      - mkdir -p "{{.DATA_ROOT}}/mcp/delta"
  up:
    desc: Start Ermes services
    deps:
      - init:data
    env:
      ERMES_DATA_ROOT: '{{.DATA_ROOT}}'
    cmds:
      - docker compose up -d

  down:
    desc: Stop Ermes services
    cmds:
      - docker compose down

  build:
    desc: Build Ermes services
    cmds:
      - docker compose build

  logs:
    desc: Follow Ermes logs
    cmds:
      - docker compose logs -f

  ps:
    desc: Show Ermes services
    cmds:
      - docker compose ps