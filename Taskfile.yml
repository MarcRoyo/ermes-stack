# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  init:data:
    desc: Initialize Ermes data directories
    cmds:
      - poetry run python -m tools.compose init

  prepare:mcp:
    desc: Prepare MCP server
    dir: ../ermes-mcp
    cmds:
      - task prepare

  up:
    desc: Start Ermes services
    cmds:
      - poetry run python -m tools.compose up -d

  down:
    desc: Stop Ermes services
    cmds:
      - poetry run python -m tools.compose down

  build:
    desc: Build all Ermes services
    cmds:
      - task: audio:build
      - task: prepare:mcp
      - poetry run python -m tools.compose build

  follow:
    desc: Follow Ermes logs
    cmds:
      - poetry run python -m tools.compose logs -f {{.CLI_ARGS}}

  logs:
    desc: Show Ermes logs. It can be limited to a specific service by passing the service name as an argument. 
    cmds:
      - poetry run python -m tools.compose logs {{.CLI_ARGS}}

  ps:
    desc: Show Ermes services
    cmds:
      - poetry run python -m tools.compose ps
 
  status:
    desc: Show Ermes services status
    cmds:
      - poetry run python -m tools.compose status

  compose:config:
    desc: Show resolved Docker Compose configuration
    cmds:
      - poetry run python -m tools.compose config

  audio:
    desc: Run an AudioServer Windows task
    cmds:
      - poetry run python -m tools.windows_task audioserver {{.CLI_ARGS}}

  audio:build:
    desc: Build Windows AudioServer
    cmds:
      - poetry run python -m tools.windows_task audioserver build

  audio:run:
    desc: Start Windows AudioServer
    cmds:
      - poetry run python -m tools.windows_task audioserver run

  audio:stop:
    desc: Stop Windows AudioServer
    cmds:
      - poetry run python -m tools.windows_task audioserver stop

  audio:status:
    desc: Show Windows AudioServer status
    cmds:
      - poetry run python -m tools.windows_task audioserver status

  run:
    desc: Start complete Ermes environment
    cmds:
      - task: audio:run
      - task: up

  stop:
    desc: Stop complete Ermes environment
    cmds:
      - defer:
          task: audio:stop
      - task: down

  restart:
    desc: Restart complete Ermes environment
    cmds:
      - task: stop
      - task: run